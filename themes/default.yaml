id: default
name: Default
author: atropine
description: Default Caelestify theme
version: 1.0.0

keybinds:
  closeUI: "Alt+Q"
  quitApp: "CommandOrControl+Shift+Q"

overrides:
  # ------ Celestify App ------ #
  CelestifyApp.celestifyBackground:
    position: fixed
    inset: 0
    width: 100%
    height: 100%
    overflow: hidden
    isolation: isolate
    background: transparent

  CelestifyApp.glassCover:
    position: absolute
    inset: 0
    z-index: 0
    background: "rgba(18, 20, 28, 0.48)"
    backdrop-filter: "blur(60px) saturate(140%)"
    -webkit-backdrop-filter: "blur(60px) saturate(140%)"
    border: "1px solid rgba(255, 255, 255, 0.12)"
    box-shadow: "inset 0 1px 0 rgba(255, 255, 255, 0.08), inset 0 0 80px rgba(255, 255, 255, 0.015)"
    pointer-events: none

  CelestifyApp.celestifyAppContent:
    position: relative
    z-index: 1
    display: flex
    flex-direction: column
    width: 100%
    height: 100%
    min-height: 0
    overflow: hidden
    
  # ------ Celestify Settings ------ #
  CelestifySettings.settingsBackground:
    position: relative
    width: 100%
    height: 100%
    min-height: 0
    pointer-events: none
    overflow: hidden

  CelestifySettings.settingsContainer:
    position: absolute
    top: 10px
    right: 10px
    bottom: 10px
    z-index: 200
    width: 300px
    max-width: "calc(100% - 20px)"
    box-sizing: border-box
    background: "rgba(48, 45, 59, 0.96)"
    color: "#E8E4EE"
    border: "1px solid rgb(70 68 94 / 0.96)"
    border-radius: 16px
    box-shadow: "-5px 0 20px rgba(0, 0, 0, 0.22)"
    backdrop-filter: "blur(24px) saturate(130%)"
    -webkit-backdrop-filter: "blur(24px) saturate(130%)"
    padding: 10px
    overflow-y: auto
    transform: "translateX(calc(100% + 10px))"
    transition: "transform 0.25s ease-in-out"
    pointer-events: auto

  CelestifySettings.settingsActive:
    transform: translateX(0)
  
  # ------ Celestify Navbar ------ #
  CelestifyNavbar.navbar:
    position: relative
    flex: "0 0 50px"
    width: 100%
    height: 50px
    display: flex
    align-items: center
    justify-content: center
    z-index: 100
    font-family: "var(--font-lexend)"

  CelestifyNavbar.navbarContainer:
    background: "rgba(48, 45, 59, 0.94)"
    color: "#E8E4EE"
    border: "1px solid rgba(232, 228, 238, 0.09)"
    border-radius: 16px
    box-shadow: "0 4px 16px rgba(0, 0, 0, 0.12)"
    backdrop-filter: "blur(20px) saturate(125%)"
    -webkit-backdrop-filter: "blur(20px) saturate(125%)"

  CelestifyNavbar.navbarContentText:
    color: "#E8E4EE"
    font-size: 17px
    font-weight: 600
    font-family: "var(--font-lexend)"
    letter-spacing: "-0.3px"

  CelestifyNavbar.navbarSearchBar:
    background: "rgba(65, 61, 77, 0.72)"
    border: "1px solid rgba(190, 181, 207, 0.12)"
    border-radius: 10px
    color: "#BEB7CD"
    transition: "background 0.25s ease-in-out"

  CelestifyNavbar.navbarSearchBar:focus-within:
    background: "rgba(75, 69, 90, 0.96)"

  CelestifyNavbar.navbarSearchIcon:
    color: "#BEB7CD"
    opacity: 0.9

  CelestifyNavbar.navbarSearchInput:
    background: transparent
    color: "#F0EDF5"
    font-family: "var(--font-lexend)"
    font-size: 12px

  CelestifyNavbar.navbarSearchInput::placeholder:
    color: "#AAA3BA"
    opacity: 1

  CelestifyNavbar.navbarSearchInput::-webkit-search-cancel-button:
    display: none
    -webkit-appearance: none
    appearance: none